services:
    app:
        container_name: app_apoint
        build:
            context: .
            dockerfile: ./_docker/Dockerfile
            args:
                USER: apoint
                UID: 1000
                PORT: 9000
                WORKDIR: /var/www

        volumes:
            - .:/var/www
            - ./storage:/var/www/storage
        ports:
            - "9000:9000"
        environment:
            - APP_ENV=local
            - APP_DEBUG=true
        depends_on:
            - db
        networks:
            - apoint

    nginx:
        image: nginx:alpine
        container_name: nginx_apoint
        ports:
            - "80:80"
        volumes:
            - .:/var/www
            - ./_docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - apoint

    db:
        image: mysql:8.0
        container_name: mysql-apoint
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: laravel
        volumes:
            - dbdata:/var/lib/mysql

#    postgres:
#        image: postgres:16
#        container_name: postgres_estora_agency
#        ports:
#            - "5432:5432"
#        environment:
#            POSTGRES_DB: estora_agency
#            POSTGRES_USER: laravel
#            POSTGRES_PASSWORD: secret007
#        volumes:
#            - postgres_data:/var/lib/postgresql/data
#        networks:
#            - Estora-agency

    node:
        image: node:20-alpine
        container_name: node_apoint
        working_dir: /var/www
        volumes:
            - .:/var/www
        command: sh -c "npm install && npm run dev"
networks:
    apoint:

volumes:
    dbdata:
